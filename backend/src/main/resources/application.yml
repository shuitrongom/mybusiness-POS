spring:
  application:
    name: mybusiness-silva-pos
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5544/mybusiness_silva}
    username: ${DB_USERNAME:pos_app}
    password: ${DB_PASSWORD:pos_app_dev}
    hikari:
      pool-name: mbs-pool
      maximum-pool-size: ${DB_POOL_MAX:10}
      minimum-idle: ${DB_POOL_MIN:2}
      connection-timeout: 30000
      # Neon (Postgres serverless) CIERRA las conexiones ociosas tras un rato. Si el pool
      # conserva esas conexiones muertas, una petición puede recibir una "closed connection"
      # y fallar (HikariCP avisa "Failed to validate connection ... Possibly consider a shorter
      # maxLifetime"). Estos ajustes reciclan/validan antes de que Neon las corte:
      #  - max-lifetime: retira cada conexión antes del corte de Neon (5 min < típico de Neon).
      #  - keepalive-time: hace ping periódico para mantenerlas vivas y detectar las caídas.
      #  - validation-timeout: valida la conexión antes de entregarla a la petición.
      #  - idle-timeout: cierra las ociosas de más del mínimo de forma ordenada.
      max-lifetime: ${DB_POOL_MAX_LIFETIME:300000}
      keepalive-time: ${DB_POOL_KEEPALIVE:120000}
      validation-timeout: ${DB_POOL_VALIDATION_TIMEOUT:5000}
      idle-timeout: ${DB_POOL_IDLE_TIMEOUT:120000}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: America/Mexico_City

  flyway:
    enabled: true
    # El schema global de administración (negocios, planes, licencias, catálogo SAT, catálogo maestro).
    default-schema: admin
    schemas: admin
    create-schemas: true
    locations: classpath:db/migration/admin
    baseline-on-migrate: true
    placeholders:
      # Rol de aplicación al que se le otorgan permisos sobre el schema admin. Por defecto
      # 'pos_app' (dev/prod). En pruebas se sobreescribe con el rol de test
      # (spring.flyway.placeholders.app_user) desde AbstractIntegrationTest.
      app_user: pos_app

app:
  bakery:
    # Envejecimiento automático de pan (día anterior -> merma). Corre cada noche en la
    # zona del negocio (America/Mexico_City). El BakeryAgingScheduler lee este cron;
    # si no se define, usa el default del @Scheduled (0 5 0 * * *). Configurable por
    # BAKERY_AGING_CRON. Coherente con el patrón de app.trial.check-cron del licensing.
    aging-cron: ${BAKERY_AGING_CRON:0 5 0 * * *}
  cfdi:
    # Proveedor de timbrado: 'simulated' (sandbox, por defecto) o 'real' cuando se contrate un PAC.
    pac: ${CFDI_PAC:simulated}
  payments:
    # Agregador de recargas/servicios: 'simulated' (sandbox) o 'real' cuando se contrate uno.
    provider: ${PAYMENTS_PROVIDER:simulated}
  security:
    jwt:
      # En producción, DB_* y este secreto deben venir de variables de entorno / gestor de secretos.
      # El secreto debe tener al menos 32 bytes (256 bits) para HMAC-SHA256.
      # IMPORTANTE: en el perfil 'prod' NO se permite este default de desarrollo. Si JWT_SECRET no
      # está definido (o es igual a este default, o mide < 32 bytes), el backend FALLA al arrancar
      # (ver JwtService). En Railway hay que definir la variable de entorno JWT_SECRET (>= 32 bytes).
      secret: ${JWT_SECRET:dev-secret-change-me-please-32bytes-minimum-0123456789}
      # Vida del token de acceso. 8 horas (480 min) = una jornada de trabajo: el cajero/dueño
      # opera todo el día sin que el token expire a media operación (antes 15 min era muy corto y,
      # si el auto-refresh fallaba, las escrituras daban 401). El refresh sigue renovando en segundo
      # plano. Configurable por JWT_ACCESS_TTL_MIN.
      access-ttl-minutes: ${JWT_ACCESS_TTL_MIN:480}
      refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:7}
      issuer: ${JWT_ISSUER:mybusiness-silva}

server:
  # Railway/▶ nube inyectan el puerto en PORT; en local cae a SERVER_PORT o 8080.
  port: ${PORT:${SERVER_PORT:8080}}
  error:
    include-message: never
    include-stacktrace: never
  forward-headers-strategy: framework

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      # Público y sin detalles: la plataforma (Railway) consulta /actuator/health sin token
      # para el health check. No expone estado interno de la BD ni de la infraestructura.
      show-details: never
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.mybusinesssilva: ${LOG_LEVEL_APP:DEBUG}
