# Perfil de desarrollo local.
# Por defecto apunta a PostgreSQL NATIVO en Windows (puerto 5432).
# Si prefieres Docker (infra/docker-compose.yml, puerto 5544), exporta
# DB_URL antes de arrancar o ajusta la variable de entorno.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/mybusiness_silva}
    username: ${DB_USERNAME:pos_app}
    password: ${DB_PASSWORD:pos_app_dev}
  jpa:
    properties:
      hibernate:
        format_sql: true
  flyway:
    clean-disabled: false

# Puerto del backend en local. Se usa 8082 para no chocar con otros
# proyectos (el otro proyecto ocupa el 8080).
server:
  port: ${SERVER_PORT:8082}

logging:
  level:
    org.hibernate.SQL: DEBUG
